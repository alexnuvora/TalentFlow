[functions.submit-application]
verify_jwt = false

# Browser CORS preflight requests do not carry a user Authorization header.
# Keep gateway JWT verification disabled so OPTIONS reaches the handler.
# ai-screen-candidate authenticates POST requests with auth.getUser().
[functions.ai-screen-candidate]
verify_jwt = false

# Invoked only by pg_cron with a rotated secret stored in Supabase Vault.
# The function validates that secret against a private server-side hash.
[functions.process-automation-queue]
verify_jwt = false

# Authenticated owner/manager invoice PDF and delivery operations.
[functions.invoice-operations]
verify_jwt = true

# Authenticated workspace-owner Stripe checkout/customer-portal operations.
[functions.subscription-billing]
verify_jwt = true

# Stripe signs webhook payloads itself; JWT gateway verification must be disabled.
[functions.stripe-webhook]
verify_jwt = false

# Local development mirrors production's invite-only access model.
# Hosted production Auth must also have "Allow new users to sign up" disabled.
[auth]
enable_signup = false
site_url = "https://www.vorlen.co.uk"
additional_redirect_urls = ["https://www.vorlen.co.uk/**"]

# Public password-recovery entry point; handler performs its own validation and rate limiting.
[functions.password-recovery]
verify_jwt = false
